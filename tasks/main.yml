# code: language=ansible
---
- name: Assert supported build
  ansible.builtin.assert:
    that:
      - "visual_studio_code_extensions_build in ('stable', 'insiders', 'oss', 'antigravity', 'cursor')"

- name: Set executable for current build
  ansible.builtin.set_fact:
    visual_studio_code_extensions_exe: '{{ visual_studio_code_extensions_executables[visual_studio_code_extensions_build] }}'
    visual_studio_code_extensions_dirname: '{{ visual_studio_code_extensions_dirnames[visual_studio_code_extensions_build] }}'

- name: Include package manager specific vars
  with_first_found:
    - '../vars/pkg-mgr/{{ ansible_pkg_mgr }}.yml'
    - ../vars/pkg-mgr/default.yml
  ansible.builtin.include_vars: '{{ item }}'

- name: Install extension cli dependencies
  ansible.builtin.package:
    name: '{{ visual_studio_code_extensions_dependencies }}'
    state: present

- name: Install extensions
  become: true
  become_user: '{{ item.0.username }}'
  visual_studio_code_extensions:
    executable: '{{ visual_studio_code_extensions_exe }}'
    dirname: '{{ visual_studio_code_extensions_dirname }}'
    name: '{{ item.1 }}'
    state: present
  with_subelements:
    - '{{ users }}'
    - visual_studio_code_extensions
    - skip_missing: true
  loop_control:
    label: '{{ item.0.username }}: {{ item.1 }}'

- name: Uninstall extensions
  become: true
  become_user: '{{ item.0.username }}'
  visual_studio_code_extensions:
    executable: '{{ visual_studio_code_extensions_exe }}'
    dirname: '{{ visual_studio_code_extensions_dirname }}'
    name: '{{ item.1 }}'
    state: absent
  with_subelements:
    - '{{ users }}'
    - visual_studio_code_extensions_absent
    - skip_missing: true
  loop_control:
    label: '{{ item.0.username }}: {{ item.1 }}'
